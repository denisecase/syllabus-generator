# ============================================================
# pyproject.toml (Python project configuration)
# ============================================================

# REQ.PYTHON: Python projects MUST include pyproject.toml as the single source of truth.
# WHY: Centralizes project configuration.

[project]
name = "denisecase-syllabus_generator" # CUSTOM: Package distribution name (use lowercase and dashes).
readme = "README.md"
requires-python = ">=3.14"
dynamic = ["version"] # WHY: Version is managed with build tools

# CUSTOM: Project metadata.
authors = [{ name = "Denise Case", email = "dcase@nwmissouri.edu" }]
description = "Syllabus generator for educational courses."
keywords = ["syllabus", "education", "course", "generator"]
license-files = ["LICENSE"]

# PyPI classifiers to help with discovery.
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Typing :: Typed",
]

dependencies = [
    # REQ.DEPS: External packages used by the project code.
    "datafun-toolkit",
    "python-docx",
]

[project.optional-dependencies]
# WHY: Optional dependency groups keep the core install clean and focused.
dev = [
    # REQ.DEV.DEPS: External packages used for linting, testing, type checking, etc.
    "bandit",
    "deptry",
    "packaging",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pyright",
    "ruff",
    "twine",
    "validate-pyproject",
]

docs = [
    # REQ.DOCS.DEPS: External packages used to generate project documentation.
    "mkdocstrings[python]",
    "zensical",
]

[project.urls]
# WHY: Canonical project links used by tooling and documentation.
# CUSTOM: Replace with repo values.
Documentation = "https://denisecase.github.io/syllabus_generator/"
Issues = "https://github.com/denisecase/syllabus_generator/issues"
Repository = "https://github.com/denisecase/syllabus_generator"

# === BANDIT (SECURITY LINTING) ===

[tool.bandit]
skips = ["B105"] # WHY: tokens are not secrets in this project; they are the core data being modeled.

# === DEPTRY (CHECK FOR UNDECLARED OR UNUSED DEPENDENCIES) ===

[tool.deptry]
# WHY: Dev and docs dependencies are not imported in source code.
ignore = ["DEP002"]

[tool.deptry.package_module_name_map]
# WHY: PyPI package names differ from importable module names.
# CUSTOM: Add project dependencies here as needed.
"denisecase-syllabus_generator" = "syllabus_generator"

[tool.deptry.per_rule_ignores]
# CUSTOM: Add self-import package here to avoid false positives.
DEP001 = ["syllabus_generator"]
DEP003 = ["syllabus_generator"]

# === PYRIGHT (TYPE CHECKING HELPS FIND COMMON ERRORS BEFORE THE CODE RUNS) ===

[tool.pyright]
# CUSTOM: Pyright configuration for static type checking.
# This configuration is NOT enforced by CI or pre-commit.
# It is provided for instructors and advanced users who
# explicitly run pyright. It is optional.
# WHY: Strict type checking helps catch bugs early.
include = ["src"]
extraPaths = ["src"]
exclude = [ "**/node_modules", "**/.*", ".venv","**/__pycache__","dist","build"]
pythonVersion = "3.14"
reportMissingImports = "warning"
reportPrivateUsage = "none"
typeCheckingMode = "basic" # strict | basic | off
useLibraryCodeForTypes = false
venv = ".venv"
venvPath = "."

# === PYTEST (VERIFY LOGIC) ===

[tool.pytest.ini_options]
# WHY: Ensure tests are discoverable and coverage is visible.
minversion = "7.0"
testpaths = ["tests"]
addopts = " --cov=src --cov-report=term-missing --cov-fail-under=60"

# === RUFF (PYTHON FORMATTING AND LINTING) ===

[tool.ruff]
# WHY: Use one fast tool for Python linting and formatting across maintained repos.
# WHY: Keep generated, cached, virtualenv, build, and docs-site output out of lint scope.
exclude = [
    ".eggs",
    "*.egg-info",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "site",
]

# WHY: Match Black/Ruff formatter default; keeps diffs compact and predictable.
line-length = 88

# WHY: Avoid unstable preview behavior unless a repo intentionally opts in.
preview = false

# WHY: Match the current repo target; modernization rules should track the supported runtime.
target-version = "py314"

# WHY: Do not apply fixes Ruff marks unsafe in shared/release-oriented repos.
unsafe-fixes = false


[tool.ruff.format]
# WHY: Spaces are the Python standard and match formatter defaults.
indent-style = "space"

# WHY: Preserve platform-appropriate line endings across Windows/macOS/Linux contributors.
line-ending = "auto"

# WHY: Preserve existing quote style to minimize meaningless diff churn.
quote-style = "preserve"


[tool.ruff.lint]
# WHY: Professional baseline for research, package, and infrastructure code.
# WHY: Catch correctness issues, import disorder, modernization drift, bug patterns,
# WHY: path handling problems, avoidable complexity, weak return flow, doc gaps,
# WHY: and obvious security hazards.
select = [
    "E",   # WHY: Basic syntax and structural correctness.
    "F",   # WHY: Undefined names, unused imports, and likely real errors.
    "W",   # WHY: Warnings that catch easy issues early.
    "I",   # WHY: Deterministic import ordering for stable diffs.
    "UP",  # WHY: Modern Python constructs for the pinned Python version.
    "B",   # WHY: Common bug patterns.

    "PTH", # WHY: Prefer pathlib for cross-platform path handling.
    "C4",  # WHY: Comprehension correctness and clarity.
    "SIM", # WHY: Remove obvious unnecessary complexity.
    "RET", # WHY: Keep return behavior explicit and readable.

    "D",   # WHY: Public/reusable code needs docstrings.
    "S",   # WHY: Catch obvious security hazards before release or reuse.
]

ignore = [
    "E501", # WHY: Line length is handled by the formatter, not Ruff lint.
    "D203", # WHY: Conflicts with D211; use the no-blank-line convention.
    "D213", # WHY: Conflicts with D212; use first-line summary convention.
    "S101", # WHY: Allow assert for tests and intentional internal invariants.
]

[tool.ruff.lint.isort]
# WHY: Ordered imports keep reviews and generated diffs readable.
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
# WHY: Package __init__ files often re-export public API names.
"src/**/__init__.py" = ["F401"]

# WHY: Generated/version files are build metadata, not authored implementation.
"src/**/_version.py" = ["ALL"]

# WHY: Tests prioritize behavior clarity over public API documentation.
# WHY: B011/B018 may be acceptable in tests depending on the assertion pattern.
# WHY: S101 is retained here even though it is also globally ignored.
"tests/**/*.py" = ["D", "B018", "B011", "S101"]

# WHY: Marker files are intentionally empty/non-Python content.
"src/**/py.typed" = ["ALL"]

[tool.ruff.lint.pydocstyle]
# WHY: Google style is the project-wide docstring convention.
convention = "google"

# === BUILD SYSTEM (PYPI RELEASE) ===
#
# REQ.PROJECT:
#   This project MUST define a build system so that Python modules
#   can be discovered, imported, and published to PyPI reliably.
#
# WHY:
#   Tools such as editors, test runners, CI, and PyPI need a consistent
#   way to locate and package importable code.
#
# REQ.STRUCTURE:
#   All importable Python code MUST live under src/.
#
# WHY:
#   A src/ layout prevents accidental imports from the repository root and
#   ensures consistent behavior across IDEs, tests, command-line runs,
#   and published distributions.

[build-system]
# REQ.BUILD: A build backend MUST be declared to enable package discovery and publishing.
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.hatch.build.targets.wheel]
# REQ.PACKAGES: Package discovery MUST be rooted at src/.
packages = ["src/syllabus_generator"]

[tool.hatch.version]
# WHY: Version is derived from git tags at build time so the package version
# always matches the release tag without manual updates to source files.
# fallback-version is used when no git tags are present (e.g., fresh clone, CI without tags).
# tag-pattern matches tags like v1.2.3 or 1.2.3 and extracts the numeric version.
source = "vcs"
fallback-version = "0.1.0"
tag-pattern = "^(?:v)?(?P<version>\\d+\\.\\d+\\.\\d+)$"

[tool.hatch.build.hooks.vcs]
# WHY: Writes computed version into package at build time.
# Can be read at runtime without importing hatch-vcs.
version-file = "src/syllabus_generator/_version.py"
